data_downloading:
  download_directory: "climate_dynamics_modeling_retrieval/"
  gexf_file: "test_graph_rr.gexf"
  processing:
    random_seed: 10
    keep_unstructured_content: false
    arxiv_rate_limit: 3
    skip_if_downloaded: true
    download_timeout_sec: 120
    max_tar_bytes: 104857600
    download_retries: 2

retriever:
  embedder: models/base/bge-large-en-v1.5
  num_retrievals: 5000
  load_arxiv_embeds: True
  apply_score_tau: true
  # Wider auto-τ band (median(head200) − margin) → fill N_max seeds
  score_tau_margin: 0.08
  recent_years: 10
  queries:
    - "climate dynamics Earth system model GCM climate modeling"
    - "climate physics extreme event attribution atmospheric ocean coupling"
    - "Earth system digital twin climate prediction numerical modeling NOT climate policy"

retrieval_nodes_path: "climate_dynamics_modeling_retrieval/retrieval_nodes.json"
failed_downloads_path: "climate_dynamics_modeling_retrieval/failed_downloads.json"
