data_downloading:
  download_directory: "robot_manipulation_retrieval/"
  gexf_file: "test_graph_rr.gexf"
  processing:
    random_seed: 10
    keep_unstructured_content: false
    arxiv_rate_limit: 3
    skip_if_downloaded: true
    download_timeout_sec: 120
    max_tar_bytes: 104857600
    download_retries: 2

retriever:
  embedder: models/base/bge-large-en-v1.5
  num_retrievals: 5000
  load_arxiv_embeds: True
  apply_score_tau: true
  score_tau_margin: 0.08
  recent_years: 10
  queries:
    - "robot manipulation dexterous grasping contact rich manipulation"
    - "visuomotor policy robot arm pick and place imitation learning"
    - "dexterous hand tactile sensing grasp planning NOT autonomous driving NOT world model video generation"

retrieval_nodes_path: "robot_manipulation_retrieval/retrieval_nodes.json"
failed_downloads_path: "robot_manipulation_retrieval/failed_downloads.json"
