data_downloading:
  download_directory: "embodied_world_model_retrieval/"
  # Graph-build / download basename. Live RR gate graph is domains.yaml →
  # description/test_graph_rr.o2.nofuture.gexf (full O2 kept as test_graph_rr.o2.gexf).
  gexf_file: "test_graph_rr.gexf"
  processing:
    random_seed: 10
    keep_unstructured_content: false
    arxiv_rate_limit: 3
    skip_if_downloaded: true
    download_timeout_sec: 120
    max_tar_bytes: 104857600
    download_retries: 2

retriever:
  embedder: models/base/bge-large-en-v1.5
  # WP3: EWM 5k + score τ + recent 10y
  num_retrievals: 5000
  load_arxiv_embeds: True
  apply_score_tau: true
  # Wider auto-τ band (median(head200) − margin) → fill N_max seeds
  score_tau_margin: 0.08
  recent_years: 10
  queries:
    - "embodied world model robot learning visual navigation manipulation planning"

retrieval_nodes_path: "embodied_world_model_retrieval/retrieval_nodes.json"
failed_downloads_path: "embodied_world_model_retrieval/failed_downloads.json"
