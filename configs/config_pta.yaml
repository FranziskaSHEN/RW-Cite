data_downloading:
  download_directory: "pulsar_timing_array_retrieval/"
  gexf_file: "test_graph_rr.gexf"
  processing:
    random_seed: 10
    keep_unstructured_content: false
    arxiv_rate_limit: 3
    skip_if_downloaded: true
    download_timeout_sec: 120
    max_tar_bytes: 104857600
    download_retries: 2

retriever:
  embedder: models/base/bge-large-en-v1.5
  num_retrievals: 5000
  load_arxiv_embeds: True
  apply_score_tau: true
  score_tau_margin: 0.10
  recent_years: 10
  queries:
    - "pulsar timing array nanohertz gravitational waves"
    - "millisecond pulsar timing IPTA NANOGrav"
    - "pulsar timing array Hellings Downs NOT VLBI continuum survey NOT AGN jet"

retrieval_nodes_path: "pulsar_timing_array_retrieval/retrieval_nodes.json"
failed_downloads_path: "pulsar_timing_array_retrieval/failed_downloads.json"
