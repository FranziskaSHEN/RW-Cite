data_downloading:
  download_directory: "metasurface_inverse_design_retrieval/"
  gexf_file: "test_graph_rr.gexf"
  processing:
    random_seed: 10
    keep_unstructured_content: false
    arxiv_rate_limit: 3
    skip_if_downloaded: true
    download_timeout_sec: 120
    max_tar_bytes: 104857600
    download_retries: 2

retriever:
  embedder: models/base/bge-large-en-v1.5
  num_retrievals: 5000
  load_arxiv_embeds: True
  apply_score_tau: true
  # Wider auto-τ band (median(head200) − margin) → fill N_max seeds
  score_tau_margin: 0.1
  recent_years: 10
  queries:
    - "dielectric metasurface differentiable inverse design metalens"
    - "neural surrogate Maxwell topology optimization photonic metasurface"
    - "deep learning inverse design nanophotonic metalens metadevice"

retrieval_nodes_path: "metasurface_inverse_design_retrieval/retrieval_nodes.json"
failed_downloads_path: "metasurface_inverse_design_retrieval/failed_downloads.json"
