  ewm:
    label: Embodied World Model
    enabled: true
    domain_config: configs/config_ewm.yaml
    # Default graph = O2 nofuture: strip test∪frontier out-edges (closes citation-edge leakage).
    # Full O2 kept as test_graph_rr.o2.gexf (pre-nofuture); admit split/jsonl frozen from full O2.
    gexf: embodied_world_model_retrieval/description/test_graph_rr.o2.nofuture.gexf
    adapter: ""
    adapter_rr: embodied_world_model_retrieval/adapter/rr_v6/model
    adapter_rr_v7: embodied_world_model_retrieval/adapter/rr_v7/model
    retrieval_nodes: embodied_world_model_retrieval/retrieval_nodes.json
    papers_dir: embodied_world_model_retrieval/research_papers

  ewm_rw:
    label: Embodied World Model (RW rebuild, O2 graph)
    enabled: false
    domain_config: configs/config_ewm_rw.yaml
    # Independent-rebuild lane: O2 title-normalize GEXF, RW-trained ranker only.
    # Isolated from production `ewm` (AS cutover) and from `ewm_as`.
    gexf: embodied_world_model_retrieval_rw/description/test_graph_rr.o2.gexf
    adapter: ""
    retrieval_nodes: embodied_world_model_retrieval_rw/retrieval_nodes.json
    # Symlinks to the shared corpus plus lane-only expansion downloads, so
    # growing this lane's corpus never mutates the production ewm corpus.
    papers_dir: embodied_world_model_retrieval_rw/research_papers

