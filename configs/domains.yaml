    label: Superconducting Quantum Computing
    enabled: true
    domain_config: configs/config_sqc.yaml
    # Split-masked graph: strip test∪frontier outgoing edges.
    gexf: superconducting_quantum_computing_retrieval/description/test_graph_rr.o2.nofuture.gexf
    adapter: ""
    adapter_rr: superconducting_quantum_computing_retrieval/adapter/rr_v6/model
    adapter_rr_v7: superconducting_quantum_computing_retrieval/adapter/rr_v7/model
    retrieval_nodes: superconducting_quantum_computing_retrieval/retrieval_nodes.json
    papers_dir: superconducting_quantum_computing_retrieval/research_papers

