data_downloading:
  download_directory: "physical_cosmology_retrieval/"
  gexf_file: "test_graph_rr.gexf"
  processing:
    random_seed: 10
    keep_unstructured_content: false
    arxiv_rate_limit: 3
    skip_if_downloaded: true
    download_timeout_sec: 120
    max_tar_bytes: 104857600
    download_retries: 2

retriever:
  embedder: models/base/bge-large-en-v1.5
  num_retrievals: 5000
  load_arxiv_embeds: True
  apply_score_tau: true
  score_tau_margin: 0.08
  recent_years: 10
  queries:
    - "physical cosmology CMB large scale structure dark energy"
    - "cosmological parameters inflation cosmic microwave background"
    - "galaxy surveys weak lensing cosmology NOT gravitational wave detectors LIGO"

retrieval_nodes_path: "physical_cosmology_retrieval/retrieval_nodes.json"
failed_downloads_path: "physical_cosmology_retrieval/failed_downloads.json"
