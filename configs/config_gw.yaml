data_downloading:
  download_directory: "gravitational_wave_retrieval/"
  gexf_file: "test_graph_rr.gexf"
  processing:
    random_seed: 10
    keep_unstructured_content: false
    arxiv_rate_limit: 3
    skip_if_downloaded: true
    download_timeout_sec: 120
    max_tar_bytes: 104857600
    download_retries: 2

retriever:
  embedder: models/base/bge-large-en-v1.5
  # N_max=5000 + multi-prototype + τ (year10 gate)
  num_retrievals: 5000
  load_arxiv_embeds: True
  apply_score_tau: true
  # Wider auto-τ band (median(head200) − margin) → more effective seeds
  score_tau_margin: 0.08
  recent_years: 10
  # D_general_plus_sub (query ablation): auto-τ ≈2746 vs current ≈2627
  queries:
    - "gravitational waves"
    - "gravitational wave astronomy"
    - "gravitational wave data analysis"
    - "pulsar timing array gravitational waves"
    - "space-based gravitational wave interferometer LISA"

retrieval_nodes_path: "gravitational_wave_retrieval/retrieval_nodes.json"
failed_downloads_path: "gravitational_wave_retrieval/failed_downloads.json"
