# Legacy external-graph compatibility lane for the RW-Cite C2s pipeline.
data_downloading:
  download_directory: "embodied_world_model_retrieval_as/"
  gexf_file: "test_graph_rr.gexf"
  processing:
    random_seed: 10
    keep_unstructured_content: false
    arxiv_rate_limit: 3
    skip_if_downloaded: true
    download_timeout_sec: 120
    max_tar_bytes: 104857600
    download_retries: 2

retriever:
  embedder: models/base/bge-large-en-v1.5
  num_retrievals: 5000
  load_arxiv_embeds: True
  apply_score_tau: true
  recent_years: 10
  queries:
    - "embodied world model robot learning visual navigation manipulation planning"

retrieval_nodes_path: "embodied_world_model_retrieval_as/retrieval_nodes.json"
failed_downloads_path: "embodied_world_model_retrieval_as/failed_downloads.json"
