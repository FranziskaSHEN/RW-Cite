data_downloading:
  download_directory: "ultracold_atoms_retrieval/"
  gexf_file: "test_graph_rr.gexf"
  processing:
    random_seed: 10
    keep_unstructured_content: false
    arxiv_rate_limit: 3
    skip_if_downloaded: true
    download_timeout_sec: 120
    max_tar_bytes: 104857600
    download_retries: 2

retriever:
  embedder: models/base/bge-large-en-v1.5
  num_retrievals: 5000
  load_arxiv_embeds: True
  apply_score_tau: true
  score_tau_margin: 0.08
  recent_years: 10
  queries:
    - "ultracold atoms Bose-Einstein condensate optical lattice"
    - "quantum gas Fermi Hubbard ultracold atoms many body"
    - "atom interferometry ultracold sensing NOT cavity QED photonics metasurface"

retrieval_nodes_path: "ultracold_atoms_retrieval/retrieval_nodes.json"
failed_downloads_path: "ultracold_atoms_retrieval/failed_downloads.json"
