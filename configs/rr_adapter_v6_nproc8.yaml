# Optional 8-GPU throughput variant of the citation-sentence adapter.
# This is not the paper configuration: configs/rr_adapter_v6.yaml is the
# authoritative recipe and uses gradient_accumulation_steps=8 as reported.

inference:
  base_model: models/base/Qwen3-32B
  generation_args:
    max_new_tokens: 512
    do_sample: false
    temperature: 0.3
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.05

training:
  mask_prompt_labels: true
  trainer_args:
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 4
    warmup_steps: 50
    num_train_epochs: 2
    learning_rate: 0.0001
    lr_scheduler_type: cosine
    logging_steps: 1
    save_steps: 200
  tokenizer:
    max_length: 2048
  qlora:
    rank: 16
    lora_alpha: 64
    lora_dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj

reference_recommend:
  k: 10
  n_pool: 50
  pool_source: l0_rrf_3.1
