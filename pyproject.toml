[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwcite"
version = "1.0.0"
description = "RW-Cite multi-domain citation-recommendation benchmark and reference framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "networkx==3.3",
  "numpy>=1.24",
  "tqdm>=4",
  "pydantic>=2",
  "torch>=2.0",
  "transformers>=4.40",
  "sentence-transformers>=2.2",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "scipy>=1.10",
  "openai>=1.0",
  "pyarrow>=14",
  "datasets>=2.18",
  "arxiv-latex-cleaner>=1.0",
  "langdetect>=1.0",
  "bibtexparser>=1.4",
  "charset-normalizer>=3.0",
  "regex>=2023.0",
]

[project.optional-dependencies]
train = [
  "accelerate>=0.30",
  "peft>=0.11",
  "bitsandbytes>=0.43",
  "bert-score>=0.3.12",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rwcite*"]

[tool.setuptools.package-data]
rwcite = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
